server:
  port: 8080

spring:
  application:
    name: lab-core-banking
  
  threads:
    virtual:
      enabled: true
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C


